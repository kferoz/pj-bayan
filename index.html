<!doctype html>
<html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PJ Bayan Archive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("pj-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head><body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M0 0l12 6-12 6z"/></svg></span><div><b>PJ பயான் காப்பகம்</b><span>Tamil talks archive · 24397 talks · 1995 → 2026</span></div></div>
  <div class="search"><input id="q" type="search" placeholder="Search title, place, topic (Tamil or English)" aria-label="Search talks"></div>
  <div class="tools">
    <button class="btn" id="sort" aria-pressed="false" title="Toggle order">Oldest first</button>
    <button class="btn" id="unseen" aria-pressed="false">Unwatched only</button>
    <button class="btn icon" id="theme" aria-label="Switch between day and night" title="Day / night">◐</button>
  </div>
</header>

<main id="app"></main>
<script src="cats.js"></script>
<script src="videos.js"></script>
<script src="app.js"></script>
</body></html>
